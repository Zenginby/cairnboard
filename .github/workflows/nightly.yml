name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    env:
      CAIRN_STRESS_ROUNDS: '200'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build:cli
      - run: npm run build:app
      - run: npm test
      - run: npm run bench:cli
        continue-on-error: true
      - run: node security/ci-scan.mjs
      - name: Scan secrets
        run: |
          # The release download sometimes answers 504; retry it (the pinned checksum below still decides).
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact
      - run: node scripts/sqlite-smoke.mjs

  macos:
    env:
      CAIRN_STRESS_ROUNDS: '200'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build:cli
      - run: npm test
      - run: npm run bench:cli
        continue-on-error: true
      - run: node scripts/sqlite-smoke.mjs

  windows:
    env:
      CAIRN_STRESS_ROUNDS: '200'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build:cli
      - run: npm test
      - run: npm run bench:cli
        continue-on-error: true
      - run: node scripts/sqlite-smoke.mjs
