name: Publish

# Publishes the npm package with npm trusted publishing (OIDC): no npm token is stored in the repository.
# The npm side trusts only this file name and the `npm` environment, which accepts `v*` tags and `main`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.4.1
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install --global "npm@$NPM_VERSION"
        env:
          NPM_VERSION: 11.19.1
      # release:verify --tag below checks that the tag is annotated, matches every version file and is checked out.
      - name: Check the tag is on main and not yet published
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main; then
            echo "Tag $TAG is not on main" >&2
            exit 1
          fi
          if npm view cairnboard versions --json | grep -Fq "\"$version\""; then
            echo "Version $version is already on npm" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run release:verify -- --tag
      - run: npm run build:cli
      - run: npm run build:app
      - run: npm run test:pack
      - run: npm publish --access public
