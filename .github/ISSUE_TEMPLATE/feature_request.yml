name: Feature request
description: Suggest something Cairnboard should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Check the [roadmap](https://github.com/Zenginby/cairnboard/blob/main/ROADMAP.md) first; if your idea is
        already there, add a 👍 to its issue instead.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or problem, in your own words. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. A rough idea is enough.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Optional. Screenshots, examples from other tools, or whether you would like to work on it.
