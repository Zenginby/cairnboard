<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09 Type to search</title>
<link rel="stylesheet" href="../_shared/base.css">
</head>
<body>
<div class="wrap">
<h1>09 Type-to-search</h1>
<p><a href="../">← index</a></p>
<p>Click the page background (not a field), then type a letter. Try <code>ğ ü ş ı ö ç İ</code>, dead keys (<code>^</code>, <code>¨</code>, <code>´</code> then a vowel) and IME input. Shortcut keys <code>n c m g / ?</code> must not open the search.</p>
<div class="row">
<label>Strategy
<select id="strategy">
<option value="focus">focus in keydown, let the browser insert the character</option>
<option value="manual">preventDefault and insert the key manually</option>
</select></label>
<button id="clear" type="button">Close search</button>
</div>
<div class="row" id="search-row" hidden>
<input id="q" type="search" placeholder="Search…" aria-label="Search">
<span id="verdict" class="muted"></span>
</div>
<h2>Log (newest first)</h2>
<ol id="log"></ol>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
